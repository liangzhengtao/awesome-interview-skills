name: CI - Validate Content

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Skill Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check all skill files exist
        run: |
          echo "Checking skill files..."
          required_files=(
            "skills/算法面试/leetcode-patterns.md"
            "skills/算法面试/data-structures-cheatsheet.md"
            "skills/算法面试/coding-interview-framework.md"
            "skills/算法面试/system-design-basics.md"
            "skills/系统设计/distributed-systems.md"
            "skills/系统设计/api-design-interview.md"
            "skills/系统设计/database-design.md"
            "skills/行为面试/star-method.md"
            "skills/行为面试/leadership-questions.md"
            "skills/行为面试/culture-fit.md"
            "skills/简历优化/tech-resume.md"
            "skills/简历优化/github-portfolio.md"
            "skills/薪资谈判/offer-negotiation.md"
            "skills/薪资谈判/career-growth.md"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi
            echo "OK: $file"
          done
          echo "All skill files present!"

      - name: Check minimum line count (150 lines)
        run: |
          echo "Checking minimum line counts..."
          min_lines=150
          failed=0
          for file in skills/**/*.md; do
            lines=$(wc -l < "$file")
            if [ "$lines" -lt "$min_lines" ]; then
              echo "FAIL: $file has $lines lines (minimum: $min_lines)"
              failed=1
            else
              echo "OK: $file ($lines lines)"
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo "Some files do not meet the minimum line count!"
            exit 1
          fi
          echo "All files meet the minimum line count!"

      - name: Check required sections
        run: |
          echo "Checking required sections in skill files..."
          required_sections=("When to Use" "Key Concepts" "Common Mistakes" "Pro Tips")
          failed=0
          for file in skills/**/*.md; do
            for section in "${required_sections[@]}"; do
              if ! grep -qi "$section" "$file"; then
                echo "FAIL: $file missing section: $section"
                failed=1
              fi
            done
          done
          if [ "$failed" -eq 1 ]; then
            echo "Some files are missing required sections!"
            exit 1
          fi
          echo "All required sections present!"

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md not found"
            exit 1
          fi
          echo "README.md exists"

      - name: Check community files
        run: |
          community_files=("LICENSE" "CONTRIBUTING.md" "CODE_OF_CONDUCT.md" "SECURITY.md" "CHANGELOG.md" ".gitignore")
          for file in "${community_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing community file: $file"
              exit 1
            fi
            echo "OK: $file"
          done
          echo "All community files present!"
